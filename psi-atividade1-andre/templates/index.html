{% extends "base.html" %}

{% block titulo %}Catálogo de Livros{% endblock %}

{% block conteudo %}
    <h1>Catálogo de Livros</h1>

    <form method="get" action="{{ url_for('index') }}">
        <input type="text" name="q" placeholder="Buscar título..." value="{{ request.args.get('q','') }}">
        <button type="submit">Buscar</button>
    </form>

    <ul>
        {% for livro in livros %}
            <li>
                <a href="{{ url_for('detalhe_livro', livro_id=livro['id']) }}">{{ livro['titulo'] }}</a>
                - {{ livro['autor'] }} ({{ livro['ano'] }})
            </li>
        {% endfor %}
    </ul>
{% endblock %}
